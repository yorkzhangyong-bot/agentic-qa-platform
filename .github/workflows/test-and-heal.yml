name: test-and-heal

# Reusable workflow: run the caller's UI tests. When they fail, the triage agent classifies each failure, the healer
# agent repairs the SELECTOR_DRIFT ones, anti-cheat.sh checks the diff, and the pr-writer agent describes the result
# in a pull request on auto-heal/<run_id>, or in an update to the open auto-heal PR for the same base branch.
#
#   config (frameworks/<framework>.json) ──► test ──(failed)──► heal: triage → healer → anti-cheat → pr-writer → PR

on:
  workflow_call:
    inputs:
      framework:
        description: Framework config to use (playwright, cypress, selenium, i.e. frameworks/<framework>.json).
        type: string
        required: true
      test_dir:
        description: Directory containing the tests, relative to the repository root. Empty means the framework's default_test_dir.
        type: string
        default: ""
      app_url:
        description: Base URL of a running, disposable test instance of the app (never production). Exported as APP_URL, BASE_URL and CYPRESS_BASE_URL.
        type: string
        default: ""
      node_version:
        description: Node.js version (always installed, because Claude Code and the browser MCP server need it).
        type: string
        default: "20"
      java_version:
        description: Java version (installed when the framework runs Maven or Gradle).
        type: string
        default: "17"
      triage_max_turns:
        description: Maximum agentic turns for the triage agent.
        type: number
        default: 15
      heal_max_turns:
        description: Maximum agentic turns for the healer agent.
        type: number
        default: 40
      claude_code_version:
        description: Version of @anthropic-ai/claude-code to install.
        type: string
        default: "2.1.283"
      playwright_mcp_version:
        description: Version of @playwright/mcp to run as the browser MCP server.
        type: string
        default: "0.0.84"
      platform_ref:
        description: Optional branch, tag or SHA of agentic-qa-platform to take scripts, agents and configs from. Empty uses the commit of this workflow (job.workflow_sha).
        type: string
        default: ""
    secrets:
      ANTHROPIC_API_KEY:
        description: Dedicated, low-quota Anthropic API key for Claude Code.
        required: true
      JIRA_TOKEN:
        description: Optional. Accepted so both workflows share the same secrets; healing does not use it.
        required: false
      PLATFORM_TOKEN:
        description: Optional token with read access to agentic-qa-platform (only needed if it is private).
        required: false
    outputs:
      failed:
        description: "'true' if the test run failed."
        value: ${{ jobs.test.outputs.failed }}
      pr_url:
        description: URL of the auto-heal pull request that was opened or updated.
        value: ${{ jobs.heal.outputs.pr_url }}

permissions:
  contents: read

# One run per caller workflow and ref at a time. Later runs wait; a heal in progress is never cancelled.
concurrency:
  group: agentic-qa-test-and-heal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  config:
    name: Framework config
    uses: ./.github/workflows/_select-framework.yml
    with:
      framework: ${{ inputs.framework }}
      platform_ref: ${{ inputs.platform_ref }}
    secrets:
      PLATFORM_TOKEN: ${{ secrets.PLATFORM_TOKEN }}

  test:
    name: Run ${{ inputs.framework }} tests
    needs: config
    runs-on: ubuntu-latest
    outputs:
      failed: ${{ steps.run.outcome == 'failure' }}
      sha: ${{ steps.sha.outputs.sha }}
    env:
      TEST_DIR: ${{ inputs.test_dir || needs.config.outputs.default_test_dir }}
      APP_URL: ${{ inputs.app_url }}
    steps:
      - name: Checkout the commit under test
        uses: actions/checkout@v7
        with:
          # For pull requests, test the PR head commit (not GitHub's merge commit), so `heal` can fix exactly
          # this commit and base its pull request on the PR branch.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Record the tested commit
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Checkout agentic-qa-platform
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ inputs.platform_ref || job.workflow_sha }}
          token: ${{ secrets.PLATFORM_TOKEN || github.token }}
          path: .agentic-qa
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          cache: ${{ needs.config.outputs.runtime == 'node' && 'npm' || '' }}

      - name: Set up Java
        if: needs.config.outputs.runtime == 'java'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          cache: ${{ hashFiles('pom.xml') != '' && 'maven' || '' }}

      - name: Install dependencies
        env:
          INSTALL_SCRIPT: ${{ needs.config.outputs.install_script }}
        run: |
          while IFS= read -r cmd; do
            [ -n "$cmd" ] || continue
            echo "::group::$cmd"
            bash -c "$cmd" < /dev/null
            echo "::endgroup::"
          done <<< "$INSTALL_SCRIPT"

      - name: Run tests
        id: run
        continue-on-error: true
        env:
          RUN_CMD: ${{ needs.config.outputs.run }}
          FRAMEWORK_ENV: ${{ needs.config.outputs.env }}
        run: |
          mkdir -p results
          env_json="${FRAMEWORK_ENV:-}"
          [ -n "$env_json" ] || env_json='{}'
          eval "$(jq -r 'to_entries[] | "export \(.key)=\(.value | tostring | @sh)"' <<< "$env_json")"
          if [ -n "$APP_URL" ]; then export BASE_URL="$APP_URL" CYPRESS_BASE_URL="$APP_URL"; fi
          echo "+ $RUN_CMD"
          bash -c "$RUN_CMD"

      - name: Collect results and reports
        if: always()
        env:
          REPORT_GLOB: ${{ needs.config.outputs.report_glob }}
        run: |
          shopt -s globstar nullglob
          dest="$RUNNER_TEMP/test-results"
          mkdir -p "$dest"
          report_dir="$(dirname "$REPORT_GLOB")"
          # Copy results/** and the report directory, keeping repo-relative paths so `heal` can restore them.
          for f in results/** $report_dir/** $REPORT_GLOB; do
            if [ -f "$f" ]; then
              mkdir -p "$dest/$(dirname "$f")"
              cp "$f" "$dest/$f"
            fi
          done
          echo "Collected $(find "$dest" -type f | wc -l) file(s) for the test-results artifact."

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ${{ runner.temp }}/test-results/
          if-no-files-found: warn
          retention-days: 14

  heal:
    name: Triage & heal
    needs: [config, test]
    # Pull requests from forks get no secrets, so there is nothing the agents could do there.
    if: >-
      needs.test.outputs.failed == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr_url: ${{ steps.pr.outputs.pull-request-url }}
    env:
      FRAMEWORK: ${{ inputs.framework }}
      TEST_DIR: ${{ inputs.test_dir || needs.config.outputs.default_test_dir }}
      APP_URL: ${{ inputs.app_url }}
      MCP_SERVER: ${{ needs.config.outputs.mcp }}
      PLAYWRIGHT_MCP_VERSION: ${{ inputs.playwright_mcp_version }}
      PR_BASE: ${{ github.head_ref || github.ref_name }}
      PR_WRITER_MAX_TURNS: "20"
      MCP_TIMEOUT: "60000"
      # Tools allowed without prompting. Bash is deliberately absent: the staged .claude/settings.json limits it to
      # the test runners and read-only commands. Agent (current Claude Code) / Task (older releases) = sub-agents.
      ALLOWED_TOOLS: Read,Edit,Write,Glob,Grep,Agent,Task
    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.test.outputs.sha }}
          fetch-depth: 50
          persist-credentials: false

      - name: Checkout agentic-qa-platform
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ inputs.platform_ref || job.workflow_sha }}
          token: ${{ secrets.PLATFORM_TOKEN || github.token }}
          path: .agentic-qa
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          cache: ${{ needs.config.outputs.runtime == 'node' && 'npm' || '' }}

      - name: Set up Java
        if: needs.config.outputs.runtime == 'java'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          cache: ${{ hashFiles('pom.xml') != '' && 'maven' || '' }}

      - name: Install dependencies
        env:
          INSTALL_SCRIPT: ${{ needs.config.outputs.install_script }}
        run: |
          while IFS= read -r cmd; do
            [ -n "$cmd" ] || continue
            echo "::group::$cmd"
            bash -c "$cmd" < /dev/null
            echo "::endgroup::"
          done <<< "$INSTALL_SCRIPT"

      - name: Download test results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: test-results
          path: .

      - name: Parse JUnit report
        id: parse
        env:
          REPORT_GLOB: ${{ needs.config.outputs.report_glob }}
        run: |
          bash .agentic-qa/scripts/parse-report.sh "$REPORT_GLOB"
          count="$(jq 'length' results/failures.json)"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -eq 0 ]; then
            echo "::warning title=Nothing to heal::The tests failed but the JUnit report contains no failing test cases. This usually means an environment or setup problem; check the 'Run tests' step."
          fi

      - name: Install Claude Code
        if: steps.parse.outputs.count != '0'
        env:
          CLAUDE_CODE_VERSION: ${{ inputs.claude_code_version }}
        run: |
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude --version

      - name: Stage agents, MCP config and Claude settings
        if: steps.parse.outputs.count != '0'
        env:
          AGENTS_DIR: ${{ needs.config.outputs.agents_dir }}
        run: |
          mkdir -p .claude/agents .git/info
          cp .agentic-qa/agents/common/* .agentic-qa/"$AGENTS_DIR"/* .claude/agents/
          cp .agentic-qa/settings/claude-settings.json .claude/settings.json
          # Pin the MCP server version in the staged copy of .mcp.json.
          jq --arg pkg "@playwright/mcp@${PLAYWRIGHT_MCP_VERSION}" \
            '.mcpServers |= map_values(if .args then .args |= map(if startswith("@playwright/mcp@") then $pkg else . end) else . end)' \
            .agentic-qa/.mcp.json > .mcp.json
          # Keep platform files and run artefacts out of git status, anti-cheat and the pull request.
          exclude=.git/info/exclude
          for f in .agentic-qa/agents/common/* .agentic-qa/"$AGENTS_DIR"/*; do
            echo "/.claude/agents/$(basename "$f")" >> "$exclude"
          done
          printf '%s\n' /.claude/settings.json /.agentic-qa/ /.mcp.json /results/ /spec.md /PR_BODY.md /.playwright-mcp/ \
            node_modules/ test-results/ playwright-report/ blob-report/ \
            cypress/screenshots/ cypress/videos/ cypress/downloads/ target/ >> "$exclude"
          npx -y "@playwright/mcp@${PLAYWRIGHT_MCP_VERSION}" --version   # warm the npx cache so the MCP server starts fast
          ls -1 .claude/agents

      - name: Record base commits
        if: steps.parse.outputs.count != '0'
        run: |
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "PLATFORM_SHA=$(git -C .agentic-qa rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Triage (triage agent)
        id: triage
        if: steps.parse.outputs.count != '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_TURNS: ${{ inputs.triage_max_turns }}
        run: |
          status=0
          claude -p "Triage every failure in results/failures.json and write results/triage.json as described in your instructions. Test dir: $TEST_DIR. Framework config: .agentic-qa/frameworks/$FRAMEWORK.json. App URL: ${APP_URL:-not provided}." \
            --agent triage \
            --append-system-prompt-file .agentic-qa/CLAUDE.md \
            --allowedTools "$ALLOWED_TOOLS,mcp__${MCP_SERVER}__*" \
            --mcp-config .mcp.json \
            --strict-mcp-config \
            --permission-mode dontAsk \
            --max-turns "$MAX_TURNS" || status=$?
          if [ ! -s results/triage.json ]; then
            echo "::error::The triage agent did not write results/triage.json (claude exit code $status)."
            exit 1
          fi
          [ "$status" -eq 0 ] || echo "::warning::claude exited with code $status (e.g. the turn limit); using the triage file it wrote."
          drift="$(jq '[.items[]? | select(.classification == "SELECTOR_DRIFT")] | length' results/triage.json)"
          echo "drift=$drift" >> "$GITHUB_OUTPUT"
          echo "SELECTOR_DRIFT items: $drift"

      - name: Heal selector drift (healer agent)
        id: heal
        if: steps.triage.outputs.drift != '' && steps.triage.outputs.drift != '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_TURNS: ${{ inputs.heal_max_turns }}
        run: |
          status=0
          claude -p "Heal the SELECTOR_DRIFT items in results/triage.json (ignore every other classification) and write results/heal-report.json as described in your instructions. Test dir: $TEST_DIR. Framework config: .agentic-qa/frameworks/$FRAMEWORK.json. App URL: ${APP_URL:-not provided}." \
            --agent healer \
            --append-system-prompt-file .agentic-qa/CLAUDE.md \
            --allowedTools "$ALLOWED_TOOLS,mcp__${MCP_SERVER}__*" \
            --mcp-config .mcp.json \
            --strict-mcp-config \
            --permission-mode dontAsk \
            --max-turns "$MAX_TURNS" || status=$?
          if [ ! -s results/heal-report.json ]; then
            echo "::error::The healer agent did not write results/heal-report.json (claude exit code $status)."
            exit 1
          fi
          [ "$status" -eq 0 ] || echo "::warning::claude exited with code $status (e.g. the turn limit); using the heal report it wrote."

      - name: Anti-cheat
        if: steps.parse.outputs.count != '0'
        env:
          FORBIDDEN_PATHS: ${{ needs.config.outputs.forbidden_paths_csv }}
        run: |
          set -o pipefail
          if [ "$(git -C .agentic-qa rev-parse HEAD)" != "$PLATFORM_SHA" ] || [ -n "$(git -C .agentic-qa status --porcelain)" ]; then
            echo "::error::Files in .agentic-qa/ were modified during the agent run, so anti-cheat.sh cannot be trusted."
            exit 1
          fi
          bash .agentic-qa/scripts/anti-cheat.sh "$FORBIDDEN_PATHS" "$BASE_SHA" | tee results/anti-cheat.txt

      - name: Detect test changes
        id: changes
        if: steps.parse.outputs.count != '0'
        run: |
          changes="$(git status --porcelain --untracked-files=all -- . ':(exclude).mcp.json' ':(exclude).claude')"
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No test files changed, so there is nothing to propose."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write PR description (pr-writer agent)
        if: steps.changes.outputs.changed == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          fingerprint() { { git diff HEAD --binary; git ls-files --others --exclude-standard -z | xargs -0 -r sha256sum; } | sha256sum; }
          before="$(fingerprint)"
          status=0
          claude -p "Write PR_BODY.md for this auto-heal run as described in your instructions. Framework: $FRAMEWORK. Test dir: $TEST_DIR. Read results/failures.json, results/triage.json, results/heal-report.json, results/anti-cheat.txt and the git diff." \
            --agent pr-writer \
            --append-system-prompt-file .agentic-qa/CLAUDE.md \
            --allowedTools "$ALLOWED_TOOLS" \
            --strict-mcp-config \
            --permission-mode dontAsk \
            --max-turns "$PR_WRITER_MAX_TURNS" || status=$?
          if [ "$(fingerprint)" != "$before" ]; then
            echo "::error::The pr-writer agent changed files after anti-cheat ran. Refusing to open the pull request."
            exit 1
          fi
          test -s PR_BODY.md || { echo "::error::The pr-writer agent did not write PR_BODY.md (claude exit code $status)."; exit 1; }

      - name: Restore platform-staged files
        if: steps.changes.outputs.changed == 'true'
        run: |
          # Staging may have overwritten files the repository tracks; they must not end up in the pull request.
          for p in .mcp.json .claude/settings.json .claude/agents; do
            if git ls-files --error-unmatch -- "$p" > /dev/null 2>&1; then git checkout -- "$p"; fi
          done
          git status --short

      - name: Look for an open auto-heal pull request
        id: existing
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --label auto-heal --state open --base "$PR_BASE" \
            --json number,headRefName,url --jq 'sort_by(.number) | first | select(. != null) | "\(.number) \(.headRefName) \(.url)"')"
          if [ -n "$pr" ]; then
            read -r number branch url <<< "$pr"
            {
              echo "number=$number"
              echo "branch=$branch"
              echo "url=$url"
            } >> "$GITHUB_OUTPUT"
            echo "Open auto-heal PR #$number ($url): pushing this run to $branch instead of opening a new PR."
          else
            echo "No open auto-heal PR targets $PR_BASE; a new one will be opened."
          fi

      - name: Open or update pull request
        id: pr
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: ${{ steps.existing.outputs.branch || format('auto-heal/{0}', github.run_id) }}
          base: ${{ github.head_ref || github.ref_name }}
          title: "Auto-heal: repair failing tests"
          body-path: PR_BODY.md
          labels: auto-heal
          commit-message: "test: auto-heal failing tests (run ${{ github.run_id }})"
          delete-branch: true

      - name: Comment on the updated pull request
        if: steps.existing.outputs.number != '' && steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.existing.outputs.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "### Auto-heal run pushed to this pull request"
            echo
            echo "Workflow run: $RUN_URL"
            echo
            cat PR_BODY.md
          } > "$RUNNER_TEMP/pr-comment.md"
          gh pr comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/pr-comment.md"

      - name: Job summary
        if: always() && steps.parse.outputs.count != '' && steps.parse.outputs.count != '0'
        env:
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
          PR_OPERATION: ${{ steps.pr.outputs.pull-request-operation }}
        run: |
          {
            echo "## Auto-heal (${FRAMEWORK})"
            echo
            echo "Failing tests: $(jq length results/failures.json)"
            if [ -f results/triage.json ]; then
              echo
              echo "| Test | Classification | Reason |"
              echo "|---|---|---|"
              jq -r '.items[]? | "| \(.name // "?" | gsub("[|\\r\\n]"; " ")) | \(.classification // "?") | \(.reason // "" | gsub("[|\\r\\n]"; " ")) |"' results/triage.json
            fi
            if [ -n "$PR_URL" ]; then echo; echo "Pull request (${PR_OPERATION:-unknown}): $PR_URL"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload agent results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: auto-heal-results
          path: |
            results/
            PR_BODY.md
          if-no-files-found: ignore
          retention-days: 14
