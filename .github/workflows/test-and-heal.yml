name: test-and-heal

# Reusable workflow: run the caller's UI tests. When they fail, the triage agent classifies each failure, and then two
# jobs run in parallel:
#   - heal: the healer agent repairs the SELECTOR_DRIFT failures, anti-cheat.sh checks the diff, and the pr-writer
#     agent describes the result in a pull request on auto-heal/<run_id>, or in an update to the open auto-heal PR
#     for the same base branch;
#   - report-defects: the defect-reporter agent writes a report for each REAL_BUG failure, and
#     scripts/report-defects.sh opens a GitHub issue for it, or comments on the open issue for the same failure.
# Agents run on the selected engine (Claude Code or OpenCode) via scripts/stage-agents.sh and scripts/run-agent.sh.
#
#   config ──► test ──(failed)──► triage ──(SELECTOR_DRIFT)──► heal: healer → anti-cheat → pr-writer → PR
#                                        └─(REAL_BUG)────────► report-defects: defect-reporter → issues

on:
  workflow_call:
    inputs:
      framework:
        description: Framework config to use (playwright, cypress, selenium, i.e. frameworks/<framework>.json).
        type: string
        required: true
      test_dir:
        description: Directory containing the tests, relative to the repository root. Empty means the framework's default_test_dir.
        type: string
        default: ""
      app_url:
        description: Base URL of a running, disposable test instance of the app (never production). Exported as APP_URL, BASE_URL and CYPRESS_BASE_URL.
        type: string
        default: ""
      engine:
        description: Agent engine, claude or opencode.
        type: string
        default: claude
      node_version:
        description: Node.js version (always installed, because the agent engines and the browser MCP server need it).
        type: string
        default: "20"
      java_version:
        description: Java version (installed when the framework runs Maven or Gradle).
        type: string
        default: "17"
      triage_max_turns:
        description: Turn budget for the triage agent (claude --max-turns; emulated with a time limit on opencode).
        type: number
        default: 15
      heal_max_turns:
        description: Turn budget for the healer agent (claude --max-turns; emulated with a time limit on opencode).
        type: number
        default: 40
      defect_max_turns:
        description: Turn budget for the defect-reporter agent (claude --max-turns; emulated with a time limit on opencode).
        type: number
        default: 20
      locator_renames:
        description: Accessible-name changes the locator check accepts after healing, one "old -> new" per line (e.g. "Sign in -> Log in"). Each use is logged and marked in the pull request. Empty accepts none.
        type: string
        default: ""
      report_defects:
        description: Open a GitHub issue for each REAL_BUG failure, or comment on the open issue for it. The caller must grant issues write either way.
        type: boolean
        default: true
      defect_labels:
        description: Comma-separated labels for new defect issues. Missing labels are created; agentic-qa is always added, because open issues are found again by it.
        type: string
        default: bug,agentic-qa
      defect_assignees:
        description: Comma-separated GitHub logins to assign new defect issues to. Empty assigns nobody.
        type: string
        default: ""
      claude_code_version:
        description: Version of @anthropic-ai/claude-code to install when engine is claude.
        type: string
        default: "2.1.283"
      opencode_version:
        description: Version of opencode-ai to install when engine is opencode.
        type: string
        default: "1.19.5"
      opencode_model:
        description: Model for the OpenCode agents, as provider/model.
        type: string
        default: deepseek/deepseek-flash
      playwright_mcp_version:
        description: Version of @playwright/mcp to run as the browser MCP server.
        type: string
        default: "0.0.84"
      platform_ref:
        description: Optional branch, tag or SHA of agentic-qa-platform to take scripts, agents and configs from. Empty uses the commit of this workflow (job.workflow_sha).
        type: string
        default: ""
    secrets:
      ANTHROPIC_API_KEY:
        description: Dedicated, low-quota Anthropic API key. Required when engine is claude.
        required: false
      DEEPSEEK_API_KEY:
        description: DeepSeek API key for OpenCode. With engine opencode, set at least one provider key.
        required: false
      OPENROUTER_API_KEY:
        description: OpenRouter API key for OpenCode. With engine opencode, set at least one provider key.
        required: false
      OPENAI_API_KEY:
        description: OpenAI API key for OpenCode. With engine opencode, set at least one provider key.
        required: false
      JIRA_TOKEN:
        description: Optional. Accepted so both workflows share the same secrets; healing does not use it.
        required: false
      PLATFORM_TOKEN:
        description: Optional token with read access to agentic-qa-platform (only needed if it is private).
        required: false
      APP_ENV:
        description: Optional. The app's own variables for the test runs, one KEY=value per line (e.g. its API keys). Loaded only into test runs, never into agent steps. Use repository secrets; secrets of a GitHub Environment aren't visible to reusable workflows.
        required: false
    outputs:
      failed:
        description: "'true' if the test run failed."
        value: ${{ jobs.test.outputs.failed }}
      pr_url:
        description: URL of the auto-heal pull request that was opened or updated.
        value: ${{ jobs.heal.outputs.pr_url }}

permissions:
  contents: read

# One run per caller workflow and ref at a time. Later runs wait; a heal in progress is never cancelled.
concurrency:
  group: agentic-qa-test-and-heal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  config:
    name: Framework config
    uses: ./.github/workflows/_select-framework.yml
    with:
      framework: ${{ inputs.framework }}
      engine: ${{ inputs.engine }}
      platform_ref: ${{ inputs.platform_ref }}
    secrets:
      PLATFORM_TOKEN: ${{ secrets.PLATFORM_TOKEN }}

  test:
    name: Run ${{ inputs.framework }} tests
    needs: config
    runs-on: ubuntu-latest
    outputs:
      failed: ${{ steps.run.outcome == 'failure' }}
      sha: ${{ steps.sha.outputs.sha }}
    env:
      TEST_DIR: ${{ inputs.test_dir || needs.config.outputs.default_test_dir }}
      APP_URL: ${{ inputs.app_url }}
    steps:
      - name: Checkout the commit under test
        uses: actions/checkout@v7
        with:
          # For pull requests, test the PR head commit (not GitHub's merge commit), so `heal` can fix exactly
          # this commit and base its pull request on the PR branch.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Record the tested commit
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Checkout agentic-qa-platform
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ inputs.platform_ref || job.workflow_sha }}
          token: ${{ secrets.PLATFORM_TOKEN || github.token }}
          path: .agentic-qa
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          cache: ${{ needs.config.outputs.runtime == 'node' && 'npm' || '' }}

      - name: Set up Java
        if: needs.config.outputs.runtime == 'java'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          cache: ${{ hashFiles('pom.xml') != '' && 'maven' || '' }}

      - name: Install dependencies
        env:
          INSTALL_SCRIPT: ${{ needs.config.outputs.install_script }}
        run: |
          while IFS= read -r cmd; do
            [ -n "$cmd" ] || continue
            echo "::group::$cmd"
            bash -c "$cmd" < /dev/null
            echo "::endgroup::"
          done <<< "$INSTALL_SCRIPT"

      # This job runs no agent, so the app's variables can go to $GITHUB_ENV for the steps below.
      - name: Load the app environment (APP_ENV)
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
        run: bash .agentic-qa/scripts/load-app-env.sh

      - name: Run tests
        id: run
        continue-on-error: true
        env:
          RUN_CMD: ${{ needs.config.outputs.run }}
          FRAMEWORK_ENV: ${{ needs.config.outputs.env }}
        run: |
          mkdir -p results
          env_json="${FRAMEWORK_ENV:-}"
          [ -n "$env_json" ] || env_json='{}'
          eval "$(jq -r 'to_entries[] | "export \(.key)=\(.value | tostring | @sh)"' <<< "$env_json")"
          if [ -n "$APP_URL" ]; then export BASE_URL="$APP_URL" CYPRESS_BASE_URL="$APP_URL"; fi
          echo "+ $RUN_CMD"
          bash -c "$RUN_CMD"

      - name: Test results summary
        if: always()
        continue-on-error: true   # the summary must never fail the job; write-summary.sh itself always exits 0
        env:
          FRAMEWORK: ${{ inputs.framework }}
          REPORT_GLOB: ${{ needs.config.outputs.report_glob }}
          COMMIT_SHA: ${{ steps.sha.outputs.sha }}
        run: bash .agentic-qa/scripts/write-summary.sh "$REPORT_GLOB"

      - name: Collect results and reports
        if: always()
        env:
          REPORT_GLOB: ${{ needs.config.outputs.report_glob }}
          ERROR_CONTEXT_GLOB: ${{ needs.config.outputs.error_context_glob }}
        run: |
          shopt -s globstar nullglob
          dest="$RUNNER_TEMP/test-results"
          mkdir -p "$dest"
          report_dir="$(dirname "$REPORT_GLOB")"
          # Copy results/**, the report directory and, for Playwright, each failed attempt's error-context.md (its
          # errors, page snapshot and test source), keeping repo-relative paths so `triage` and `heal` can restore them.
          for f in results/** $report_dir/** $REPORT_GLOB $ERROR_CONTEXT_GLOB; do
            if [ -f "$f" ]; then
              mkdir -p "$dest/$(dirname "$f")"
              cp "$f" "$dest/$f"
            fi
          done
          echo "Collected $(find "$dest" -type f | wc -l) file(s) for the test-results artifact."

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ${{ runner.temp }}/test-results/
          if-no-files-found: warn
          retention-days: 14

  triage:
    name: Triage
    needs: [config, test]
    # Pull requests from forks get no secrets, so there is nothing the agents could do there.
    if: >-
      needs.test.outputs.failed == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      selector_drift: ${{ steps.triage.outputs.selector_drift }}
      real_bugs: ${{ steps.triage.outputs.real_bugs }}
    env:
      ENGINE: ${{ inputs.engine }}
      FRAMEWORK: ${{ inputs.framework }}
      TEST_DIR: ${{ inputs.test_dir || needs.config.outputs.default_test_dir }}
      APP_URL: ${{ inputs.app_url }}
      PLATFORM_DIR: .agentic-qa
      MCP_SERVER: ${{ needs.config.outputs.mcp }}
      PLAYWRIGHT_MCP_VERSION: ${{ inputs.playwright_mcp_version }}
      OPENCODE_MODEL: ${{ inputs.opencode_model }}
      MCP_TIMEOUT: "60000"
    steps:
      # heal and report-defects run only after this job succeeded, so they rely on this check.
      - name: Check engine credentials
        env:
          HAS_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_DEEPSEEK: ${{ secrets.DEEPSEEK_API_KEY != '' }}
          HAS_OPENROUTER: ${{ secrets.OPENROUTER_API_KEY != '' }}
          HAS_OPENAI: ${{ secrets.OPENAI_API_KEY != '' }}
        run: |
          case "$ENGINE" in
            claude)
              [ "$HAS_ANTHROPIC" = true ] || { echo "::error::engine claude needs the ANTHROPIC_API_KEY secret."; exit 1; }
              ;;
            opencode)
              if [ "$HAS_DEEPSEEK" != true ] && [ "$HAS_OPENROUTER" != true ] && [ "$HAS_OPENAI" != true ]; then
                echo "::error::engine opencode needs at least one of the DEEPSEEK_API_KEY, OPENROUTER_API_KEY or OPENAI_API_KEY secrets."
                exit 1
              fi
              provider="${OPENCODE_MODEL%%/*}"
              case "$provider" in
                deepseek) has="$HAS_DEEPSEEK"; key=DEEPSEEK_API_KEY ;;
                openrouter) has="$HAS_OPENROUTER"; key=OPENROUTER_API_KEY ;;
                openai) has="$HAS_OPENAI"; key=OPENAI_API_KEY ;;
                *) has=unknown; key="" ;;
              esac
              if [ "$has" = false ]; then echo "::warning::opencode_model '$OPENCODE_MODEL' uses provider '$provider', but $key is not set."; fi
              ;;
            *)
              echo "::error::Unknown engine '$ENGINE'. Use claude or opencode."
              exit 1
              ;;
          esac
          echo "Agent engine: $ENGINE"

      - name: Checkout the tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.test.outputs.sha }}
          fetch-depth: 50
          persist-credentials: false

      - name: Checkout agentic-qa-platform
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ inputs.platform_ref || job.workflow_sha }}
          token: ${{ secrets.PLATFORM_TOKEN || github.token }}
          path: .agentic-qa
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          cache: ${{ needs.config.outputs.runtime == 'node' && 'npm' || '' }}

      - name: Set up Java
        if: needs.config.outputs.runtime == 'java'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          cache: ${{ hashFiles('pom.xml') != '' && 'maven' || '' }}

      # The triage agent may re-run a failing test once to check for flakiness.
      - name: Install dependencies
        env:
          INSTALL_SCRIPT: ${{ needs.config.outputs.install_script }}
        run: |
          while IFS= read -r cmd; do
            [ -n "$cmd" ] || continue
            echo "::group::$cmd"
            bash -c "$cmd" < /dev/null
            echo "::endgroup::"
          done <<< "$INSTALL_SCRIPT"

      # Restores the reports and, for Playwright, test-results/<folder>/error-context.md: the path that each failure's
      # "Error Context:" line names, where the triage agent reads it.
      - name: Download test results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: test-results
          path: .

      - name: Parse JUnit report
        id: parse
        env:
          REPORT_GLOB: ${{ needs.config.outputs.report_glob }}
        run: |
          bash "$PLATFORM_DIR/scripts/parse-report.sh" "$REPORT_GLOB"
          count="$(jq 'length' results/failures.json)"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Failing test cases to triage: $count"

      - name: Install agent engine
        if: steps.parse.outputs.count != '0'
        env:
          CLAUDE_CODE_VERSION: ${{ inputs.claude_code_version }}
          OPENCODE_VERSION: ${{ inputs.opencode_version }}
        run: |
          if [ "$ENGINE" = opencode ]; then
            npm install -g "opencode-ai@${OPENCODE_VERSION}"
            opencode --version
          else
            npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
            claude --version
          fi

      - name: Stage agents and engine config
        if: steps.parse.outputs.count != '0'
        run: bash "$PLATFORM_DIR/scripts/stage-agents.sh"

      - name: Triage (triage agent)
        id: triage
        if: steps.parse.outputs.count != '0'
        env:
          ANTHROPIC_API_KEY: ${{ inputs.engine == 'claude' && secrets.ANTHROPIC_API_KEY || '' }}
          DEEPSEEK_API_KEY: ${{ inputs.engine == 'opencode' && secrets.DEEPSEEK_API_KEY || '' }}
          OPENROUTER_API_KEY: ${{ inputs.engine == 'opencode' && secrets.OPENROUTER_API_KEY || '' }}
          OPENAI_API_KEY: ${{ inputs.engine == 'opencode' && secrets.OPENAI_API_KEY || '' }}
          AGENT: triage
          MAX_TURNS: ${{ inputs.triage_max_turns }}
          EXPECTED_OUTPUT: results/triage.json
          PROMPT: >-
            Triage every failure in results/failures.json and write results/triage.json as described in your
            instructions. Test dir: ${{ env.TEST_DIR }}. Framework config: .agentic-qa/frameworks/${{ inputs.framework }}.json.
            App URL: ${{ inputs.app_url || 'not provided' }}.
        run: |
          bash "$PLATFORM_DIR/scripts/run-agent.sh"
          drift="$(jq '[.items[]? | select(.classification == "SELECTOR_DRIFT")] | length' results/triage.json)"
          bugs="$(jq '[.items[]? | select(.classification == "REAL_BUG")] | length' results/triage.json)"
          {
            echo "selector_drift=$drift"
            echo "real_bugs=$bugs"
          } >> "$GITHUB_OUTPUT"
          echo "SELECTOR_DRIFT items: $drift (heal), REAL_BUG items: $bugs (report-defects)"

      # heal and report-defects run only after this job succeeded, and only on what results/triage.json classifies.
      # Without a triage result they would just be skipped, so the job fails here and says why: nothing to triage,
      # no triage.json, or one that classifies none of the failures.
      - name: Check the triage result
        if: ${{ !cancelled() && steps.parse.outcome != 'skipped' }}
        env:
          TRIAGE_OUTCOME: ${{ steps.triage.outcome }}
        run: bash "$PLATFORM_DIR/scripts/check-triage.sh"

      # The summary reads a fresh copy of the reports, because a re-run during triage can overwrite the ones in the
      # workspace (a single Maven test rewrites its class's report; Cypress may add a report for the spec).
      - name: Download the original test reports for the summary
        if: always() && steps.triage.outcome != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: test-results
          path: ${{ runner.temp }}/test-results

      - name: Test results summary with triage
        if: always() && steps.triage.outcome != 'skipped'
        continue-on-error: true   # the summary must never fail the job; write-summary.sh itself always exits 0
        env:
          REPORT_GLOB: ${{ runner.temp }}/test-results/${{ needs.config.outputs.report_glob }}
          COMMIT_SHA: ${{ needs.test.outputs.sha }}
        run: bash "$PLATFORM_DIR/scripts/write-summary.sh" "$REPORT_GLOB" results/triage.json

      # heal and report-defects download this instead of triaging again.
      - name: Upload triage results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: triage
          path: |
            results/triage.json
            results/failures.json
          if-no-files-found: warn
          retention-days: 14

  heal:
    name: Heal selector drift
    needs: [config, test, triage]
    if: fromJSON(needs.triage.outputs.selector_drift || '0') > 0
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr_url: ${{ steps.pr.outputs.pull-request-url }}
    env:
      ENGINE: ${{ inputs.engine }}
      FRAMEWORK: ${{ inputs.framework }}
      TEST_DIR: ${{ inputs.test_dir || needs.config.outputs.default_test_dir }}
      APP_URL: ${{ inputs.app_url }}
      PLATFORM_DIR: .agentic-qa
      MCP_SERVER: ${{ needs.config.outputs.mcp }}
      PLAYWRIGHT_MCP_VERSION: ${{ inputs.playwright_mcp_version }}
      OPENCODE_MODEL: ${{ inputs.opencode_model }}
      PR_BASE: ${{ github.head_ref || github.ref_name }}
      MCP_TIMEOUT: "60000"
    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.test.outputs.sha }}
          fetch-depth: 50
          persist-credentials: false

      - name: Checkout agentic-qa-platform
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ inputs.platform_ref || job.workflow_sha }}
          token: ${{ secrets.PLATFORM_TOKEN || github.token }}
          path: .agentic-qa
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          cache: ${{ needs.config.outputs.runtime == 'node' && 'npm' || '' }}

      - name: Set up Java
        if: needs.config.outputs.runtime == 'java'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          cache: ${{ hashFiles('pom.xml') != '' && 'maven' || '' }}

      - name: Install dependencies
        env:
          INSTALL_SCRIPT: ${{ needs.config.outputs.install_script }}
        run: |
          while IFS= read -r cmd; do
            [ -n "$cmd" ] || continue
            echo "::group::$cmd"
            bash -c "$cmd" < /dev/null
            echo "::endgroup::"
          done <<< "$INSTALL_SCRIPT"

      - name: Download triage results
        uses: actions/download-artifact@v8
        with:
          name: triage
          path: results

      # The failures' error-context.md files (Playwright), at the paths their "Error Context:" lines name, as in triage.
      # Only these files: the original reports stay out of this job. A test run empties test-results/, so they are
      # there until the healer's first run.
      - name: Download the test results
        id: test_results
        if: needs.config.outputs.error_context_glob != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: test-results
          path: ${{ runner.temp }}/test-results

      - name: Restore the failures' error context
        if: steps.test_results.outcome == 'success'
        env:
          ERROR_CONTEXT_GLOB: ${{ needs.config.outputs.error_context_glob }}
        run: |
          shopt -s globstar nullglob
          src="$RUNNER_TEMP/test-results"
          count=0
          for f in "$src"/$ERROR_CONTEXT_GLOB; do
            rel="${f#"$src"/}"
            mkdir -p "$(dirname "$rel")"
            cp "$f" "$rel"
            count=$((count + 1))
          done
          echo "Restored $count error-context file(s)."

      # Masks the APP_ENV values in this job's logs before any agent runs. Only the verification run gets the values.
      - name: Check APP_ENV
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
        run: bash "$PLATFORM_DIR/scripts/load-app-env.sh" --check

      - name: Install agent engine
        env:
          CLAUDE_CODE_VERSION: ${{ inputs.claude_code_version }}
          OPENCODE_VERSION: ${{ inputs.opencode_version }}
        run: |
          if [ "$ENGINE" = opencode ]; then
            npm install -g "opencode-ai@${OPENCODE_VERSION}"
            opencode --version
          else
            npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
            claude --version
          fi

      - name: Stage agents and engine config
        run: bash "$PLATFORM_DIR/scripts/stage-agents.sh"

      - name: Record base commits
        run: |
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "PLATFORM_SHA=$(git -C "$PLATFORM_DIR" rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Heal selector drift (healer agent)
        id: heal
        env:
          ANTHROPIC_API_KEY: ${{ inputs.engine == 'claude' && secrets.ANTHROPIC_API_KEY || '' }}
          DEEPSEEK_API_KEY: ${{ inputs.engine == 'opencode' && secrets.DEEPSEEK_API_KEY || '' }}
          OPENROUTER_API_KEY: ${{ inputs.engine == 'opencode' && secrets.OPENROUTER_API_KEY || '' }}
          OPENAI_API_KEY: ${{ inputs.engine == 'opencode' && secrets.OPENAI_API_KEY || '' }}
          AGENT: healer
          MAX_TURNS: ${{ inputs.heal_max_turns }}
          EXPECTED_OUTPUT: results/heal-report.json
          PROMPT: >-
            Heal the SELECTOR_DRIFT items in results/triage.json (ignore every other classification) and write
            results/heal-report.json as described in your instructions. Test dir: ${{ env.TEST_DIR }}. Framework config:
            .agentic-qa/frameworks/${{ inputs.framework }}.json. App URL: ${{ inputs.app_url || 'not provided' }}.
        run: bash "$PLATFORM_DIR/scripts/run-agent.sh"

      - name: Detect test changes
        id: changes
        run: |
          changes="$(git status --porcelain --untracked-files=all -- . ':(exclude).mcp.json' ':(exclude).claude' \
            ':(exclude).opencode' ':(exclude)AGENTS.md' ':(exclude)opencode.json')"
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No test files changed, so there is nothing to propose."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Locator check, part 1: each locator the healer changed, old and new. The verification run below records what
      # the new ones point to (Playwright: a probe preloaded into the test run). Other frameworks: nothing yet.
      - name: List the changed locators
        id: locators
        if: steps.changes.outputs.changed == 'true'
        env:
          LOCATOR_CHECK_DIR: ${{ runner.temp }}/locator-check
        run: bash "$PLATFORM_DIR/scripts/locator-check.sh" targets

      # The healer's own runs don't get APP_ENV, because agents never see the app's secrets. This run does, in this
      # step only, so the healed suite also runs against the app as the test job ran it. It runs before anti-cheat, so
      # anti-cheat also checks any file it writes. Its result goes to the job summary and the PR writer; it doesn't
      # block the pull request.
      - name: Verify healed tests
        id: verify
        if: steps.changes.outputs.changed == 'true'
        continue-on-error: true
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
          RUN_CMD: ${{ needs.config.outputs.run }}
          FRAMEWORK_ENV: ${{ needs.config.outputs.env }}
          REPORT_GLOB: ${{ needs.config.outputs.report_glob }}
          LOCATOR_PROBE: ${{ steps.locators.outputs.probe }}
          LOCATOR_PROBE_TARGETS: ${{ runner.temp }}/locator-check/probe-targets.json
          LOCATOR_PROBE_OUT: ${{ runner.temp }}/locator-check/after.jsonl
        run: |
          shopt -s globstar nullglob
          for f in $REPORT_GLOB; do rm -f -- "$f"; done   # drop the reports of the healer's own runs
          mkdir -p results
          env_json="${FRAMEWORK_ENV:-}"
          [ -n "$env_json" ] || env_json='{}'
          eval "$(jq -r 'to_entries[] | "export \(.key)=\(.value | tostring | @sh)"' <<< "$env_json")"
          if [ -n "$APP_URL" ]; then export BASE_URL="$APP_URL" CYPRESS_BASE_URL="$APP_URL"; fi
          # The locator check's probe: read-only, it records the element of each changed locator.
          if [ -n "$LOCATOR_PROBE" ]; then export NODE_OPTIONS="${NODE_OPTIONS:+$NODE_OPTIONS }--require $LOCATOR_PROBE"; fi
          echo "+ $RUN_CMD"
          bash "$PLATFORM_DIR/scripts/load-app-env.sh" -- bash -c "$RUN_CMD"

      - name: Verification results
        if: always() && steps.verify.outcome != 'skipped'
        continue-on-error: true   # the summary must never fail the job
        env:
          REPORT_GLOB: ${{ needs.config.outputs.report_glob }}
          COMMIT_SHA: ${{ needs.test.outputs.sha }}
          SUMMARY_TITLE: Test results after healing
        run: |
          bash "$PLATFORM_DIR/scripts/write-summary.sh" "$REPORT_GLOB"
          FAILURES_OUT=results/verify-failures.json bash "$PLATFORM_DIR/scripts/parse-report.sh" "$REPORT_GLOB"

      - name: Anti-cheat
        env:
          FORBIDDEN_PATHS: ${{ needs.config.outputs.forbidden_paths_csv }}
        run: |
          set -o pipefail
          if [ "$(git -C "$PLATFORM_DIR" rev-parse HEAD)" != "$PLATFORM_SHA" ] || [ -n "$(git -C "$PLATFORM_DIR" status --porcelain)" ]; then
            echo "::error::Files in .agentic-qa/ were modified during the agent run, so anti-cheat.sh cannot be trusted."
            exit 1
          fi
          bash "$PLATFORM_DIR/scripts/anti-cheat.sh" "$FORBIDDEN_PATHS" "$BASE_SHA" | tee results/anti-cheat.txt

      - name: Write PR description (pr-writer agent)
        if: steps.changes.outputs.changed == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ inputs.engine == 'claude' && secrets.ANTHROPIC_API_KEY || '' }}
          DEEPSEEK_API_KEY: ${{ inputs.engine == 'opencode' && secrets.DEEPSEEK_API_KEY || '' }}
          OPENROUTER_API_KEY: ${{ inputs.engine == 'opencode' && secrets.OPENROUTER_API_KEY || '' }}
          OPENAI_API_KEY: ${{ inputs.engine == 'opencode' && secrets.OPENAI_API_KEY || '' }}
          AGENT: pr-writer
          MAX_TURNS: "20"
          EXPECTED_OUTPUT: PR_BODY.md
          PROMPT: >-
            Write PR_BODY.md for this auto-heal run as described in your instructions. Framework: ${{ inputs.framework }}.
            Test dir: ${{ env.TEST_DIR }}. Verification run after healing, with the app's APP_ENV: ${{ steps.verify.outcome }}.
            Read results/failures.json, results/triage.json, results/heal-report.json, results/verify-failures.json,
            results/anti-cheat.txt and the git diff.
        run: |
          fingerprint() { { git diff HEAD --binary; git ls-files --others --exclude-standard -z | xargs -0 -r sha256sum; } | sha256sum; }
          before="$(fingerprint)"
          bash "$PLATFORM_DIR/scripts/run-agent.sh"
          if [ "$(fingerprint)" != "$before" ]; then
            echo "::error::The pr-writer agent changed files after anti-cheat ran. Refusing to open the pull request."
            exit 1
          fi

      # Locator check, part 2. "Before" comes from fresh copies of the failing run's artifacts, which no agent touched:
      # each old locator on its page snapshot. A changed role or name makes the pull request a draft; an element that
      # can't be compared is listed for the reviewer. The section goes into PR_BODY.md and the job summary.
      - name: Download the failing run for the locator check
        if: steps.changes.outputs.changed == 'true' && steps.locators.outputs.supported == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: test-results
          path: ${{ runner.temp }}/locator-check/before

      - name: Download the failures for the locator check
        if: steps.changes.outputs.changed == 'true' && steps.locators.outputs.supported == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: triage
          path: ${{ runner.temp }}/locator-check/before/results

      - name: Locator check
        id: locator_check
        if: steps.changes.outputs.changed == 'true'
        env:
          LOCATOR_CHECK_DIR: ${{ runner.temp }}/locator-check
          LOCATOR_RENAMES: ${{ inputs.locator_renames }}
        run: bash "$PLATFORM_DIR/scripts/locator-check.sh" report

      - name: Restore platform-staged files
        if: steps.changes.outputs.changed == 'true'
        run: |
          # Staging may have overwritten files the repository tracks; they must not end up in the pull request.
          # `.opencode` covers the staged .opencode/agents/.
          for p in .mcp.json .claude/settings.json .claude/agents .opencode AGENTS.md opencode.json; do
            if git ls-files --error-unmatch -- "$p" > /dev/null 2>&1; then git checkout -- "$p"; fi
          done
          git status --short

      - name: Look for an open auto-heal pull request
        id: existing
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --label auto-heal --state open --base "$PR_BASE" \
            --json number,headRefName,url --jq 'sort_by(.number) | first | select(. != null) | "\(.number) \(.headRefName) \(.url)"')"
          if [ -n "$pr" ]; then
            read -r number branch url <<< "$pr"
            {
              echo "number=$number"
              echo "branch=$branch"
              echo "url=$url"
            } >> "$GITHUB_OUTPUT"
            echo "Open auto-heal PR #$number ($url): pushing this run to $branch instead of opening a new PR."
          else
            echo "No open auto-heal PR targets $PR_BASE; a new one will be opened."
          fi

      - name: Open or update pull request
        id: pr
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: ${{ steps.existing.outputs.branch || format('auto-heal/{0}', github.run_id) }}
          base: ${{ github.head_ref || github.ref_name }}
          title: "Auto-heal: repair failing tests"
          body-path: PR_BODY.md
          labels: auto-heal
          commit-message: "test: auto-heal failing tests (run ${{ github.run_id }})"
          delete-branch: true
          # A locator that now points to an element with another role or name: a draft, also when this run updates an
          # open auto-heal pull request, until a reviewer marks it ready.
          draft: ${{ steps.locator_check.outputs.draft == 'true' && 'always-true' || 'false' }}

      - name: Comment on the updated pull request
        if: steps.existing.outputs.number != '' && steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.existing.outputs.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "### Auto-heal run pushed to this pull request"
            echo
            echo "Workflow run: $RUN_URL (engine: $ENGINE)"
            echo
            cat PR_BODY.md
          } > "$RUNNER_TEMP/pr-comment.md"
          gh pr comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/pr-comment.md"

      - name: Job summary
        if: always()
        env:
          SELECTOR_DRIFT: ${{ needs.triage.outputs.selector_drift }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
          PR_OPERATION: ${{ steps.pr.outputs.pull-request-operation }}
        run: |
          # The triage job's summary lists every failure with its classification and reason.
          {
            echo "## Auto-heal (${FRAMEWORK}, engine ${ENGINE})"
            echo
            echo "SELECTOR_DRIFT failures handed to the healer: ${SELECTOR_DRIFT}"
            if [ -n "$PR_URL" ]; then echo; echo "Pull request (${PR_OPERATION:-unknown}): $PR_URL"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload agent results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: auto-heal-results
          path: |
            results/
            PR_BODY.md
          if-no-files-found: ignore
          retention-days: 14

  report-defects:
    name: Report defects
    needs: [config, test, triage]
    if: inputs.report_defects && fromJSON(needs.triage.outputs.real_bugs || '0') > 0
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    env:
      ENGINE: ${{ inputs.engine }}
      FRAMEWORK: ${{ inputs.framework }}
      TEST_DIR: ${{ inputs.test_dir || needs.config.outputs.default_test_dir }}
      APP_URL: ${{ inputs.app_url }}
      PLATFORM_DIR: .agentic-qa
      MCP_SERVER: ${{ needs.config.outputs.mcp }}
      PLAYWRIGHT_MCP_VERSION: ${{ inputs.playwright_mcp_version }}
      OPENCODE_MODEL: ${{ inputs.opencode_model }}
      MCP_TIMEOUT: "60000"
      COMMIT_SHA: ${{ needs.test.outputs.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # The test code is read for the steps to reproduce; nothing is installed, because no test runs here.
      - name: Checkout the tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.test.outputs.sha }}
          persist-credentials: false

      - name: Checkout agentic-qa-platform
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ inputs.platform_ref || job.workflow_sha }}
          token: ${{ secrets.PLATFORM_TOKEN || github.token }}
          path: .agentic-qa
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}

      - name: Download triage results
        uses: actions/download-artifact@v8
        with:
          name: triage
          path: results

      - name: List defect candidates and fingerprints
        run: bash "$PLATFORM_DIR/scripts/report-defects.sh" prepare

      - name: Install agent engine
        env:
          CLAUDE_CODE_VERSION: ${{ inputs.claude_code_version }}
          OPENCODE_VERSION: ${{ inputs.opencode_version }}
        run: |
          if [ "$ENGINE" = opencode ]; then
            npm install -g "opencode-ai@${OPENCODE_VERSION}"
            opencode --version
          else
            npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
            claude --version
          fi

      - name: Stage agents and engine config
        run: bash "$PLATFORM_DIR/scripts/stage-agents.sh"

      - name: Write defect reports (defect-reporter agent)
        env:
          ANTHROPIC_API_KEY: ${{ inputs.engine == 'claude' && secrets.ANTHROPIC_API_KEY || '' }}
          DEEPSEEK_API_KEY: ${{ inputs.engine == 'opencode' && secrets.DEEPSEEK_API_KEY || '' }}
          OPENROUTER_API_KEY: ${{ inputs.engine == 'opencode' && secrets.OPENROUTER_API_KEY || '' }}
          OPENAI_API_KEY: ${{ inputs.engine == 'opencode' && secrets.OPENAI_API_KEY || '' }}
          AGENT: defect-reporter
          MAX_TURNS: ${{ inputs.defect_max_turns }}
          ALLOWED_TOOLS: Read,Write,Glob,Grep
          PROMPT: >-
            Write a defect report for every candidate in results/defect-candidates.json as described in your
            instructions. Test dir: ${{ env.TEST_DIR }}. Framework config: .agentic-qa/frameworks/${{ inputs.framework }}.json.
            App URL: ${{ inputs.app_url || 'not provided' }}.
        run: |
          # The agent may write only in results/defects/. Every other file must be unchanged afterwards, above all
          # the platform checkout and results/defect-candidates.json, which decide what gets published.
          files() {
            find . \( -path ./.git -o -path ./.agentic-qa/.git -o -path ./results/defects -o -path ./.playwright-mcp \
              -o -path ./.opencode \) -prune -o -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum
          }
          files > "$RUNNER_TEMP/files-before.txt"
          bash "$PLATFORM_DIR/scripts/run-agent.sh" || echo "::warning::The defect-reporter stopped early (exit code $?); publishing the reports it wrote."
          files > "$RUNNER_TEMP/files-after.txt"
          if ! diff "$RUNNER_TEMP/files-before.txt" "$RUNNER_TEMP/files-after.txt"; then
            echo "::error::The defect-reporter agent changed files outside results/defects/ (see the diff above). Refusing to open issues."
            exit 1
          fi

      - name: Open or update issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFECT_LABELS: ${{ inputs.defect_labels }}
          DEFECT_ASSIGNEES: ${{ inputs.defect_assignees }}
        run: bash "$PLATFORM_DIR/scripts/report-defects.sh" publish

      - name: Upload defect reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: defects
          path: |
            results/defect-candidates.json
            results/defects/
            results/defects-report.json
          if-no-files-found: ignore
          retention-days: 14
