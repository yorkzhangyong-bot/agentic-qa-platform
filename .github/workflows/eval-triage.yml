name: eval-triage

# Offline evaluation of the triage agent (agents/common/triage.md): replays the labelled failures in
# evals/triage/cases.jsonl through the real agent, one temporary CI-like workspace per case and run, and reports the
# accuracy, the per-category accuracy, a confusion table and the critical count (REAL_BUG classified as
# SELECTOR_DRIFT). Manual only, because every case is a paid agent run. See evals/README.md.
#
# The agents run on the same machine as this checkout, so the answer key must not be on it: run-eval.py reads the
# cases and the sample project into memory, then deletes all of evals/, every other file that gives an answer away,
# and .git before the first agent starts (--hide-answers). A run whose log mentions cases.jsonl, evals/ or this
# checkout, or quotes a case's "why", is reported as invalid and not scored.

on:
  workflow_dispatch:
    inputs:
      engine:
        description: Agent engine.
        type: choice
        options: [claude, opencode]
        default: claude
      opencode_model:
        description: Model for engine opencode, as provider/model.
        type: string
        default: deepseek/deepseek-flash
      claude_model:
        description: Optional model for engine claude (sets ANTHROPIC_MODEL). Empty uses Claude Code's default.
        type: string
        default: ""
      repeats:
        description: Runs per case. More than 1 measures how consistent the answers are.
        type: number
        default: 1
      snapshots:
        description: Give each case the error-context.md files (page snapshot) that test-and-heal gives triage for Playwright. Off measures triage without them.
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: eval-triage
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  eval:
    name: Triage eval (${{ inputs.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ENGINE: ${{ inputs.engine }}
      OPENCODE_MODEL: ${{ inputs.opencode_model }}
      CLAUDE_MODEL: ${{ inputs.claude_model }}
      # The versions test-and-heal.yml installs by default.
      CLAUDE_CODE_VERSION: "2.1.283"
      OPENCODE_VERSION: "1.19.5"
      PLAYWRIGHT_MCP_VERSION: "0.0.84"
    steps:
      - name: Check engine credentials
        env:
          HAS_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_DEEPSEEK: ${{ secrets.DEEPSEEK_API_KEY != '' }}
          HAS_OPENROUTER: ${{ secrets.OPENROUTER_API_KEY != '' }}
          HAS_OPENAI: ${{ secrets.OPENAI_API_KEY != '' }}
        run: |
          if [ "$ENGINE" = claude ]; then
            [ "$HAS_ANTHROPIC" = true ] || { echo "::error::engine claude needs the ANTHROPIC_API_KEY secret in this repository."; exit 1; }
          else
            provider="${OPENCODE_MODEL%%/*}"
            case "$provider" in
              deepseek) has="$HAS_DEEPSEEK"; key=DEEPSEEK_API_KEY ;;
              openrouter) has="$HAS_OPENROUTER"; key=OPENROUTER_API_KEY ;;
              openai) has="$HAS_OPENAI"; key=OPENAI_API_KEY ;;
              *) echo "::error::opencode_model '$OPENCODE_MODEL' uses provider '$provider'; the eval has keys for deepseek, openrouter and openai."; exit 1 ;;
            esac
            [ "$has" = true ] || { echo "::error::opencode_model '$OPENCODE_MODEL' needs the $key secret in this repository."; exit 1; }
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the result file records the last commit that changed agents/common/triage.md
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install agent engine
        run: |
          if [ "$ENGINE" = opencode ]; then
            npm install -g "opencode-ai@${OPENCODE_VERSION}"
            opencode --version
          else
            npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
            claude --version
          fi

      - name: Run the triage eval
        env:
          ANTHROPIC_API_KEY: ${{ inputs.engine == 'claude' && secrets.ANTHROPIC_API_KEY || '' }}
          DEEPSEEK_API_KEY: ${{ inputs.engine == 'opencode' && secrets.DEEPSEEK_API_KEY || '' }}
          OPENROUTER_API_KEY: ${{ inputs.engine == 'opencode' && secrets.OPENROUTER_API_KEY || '' }}
          OPENAI_API_KEY: ${{ inputs.engine == 'opencode' && secrets.OPENAI_API_KEY || '' }}
          REPEATS: ${{ inputs.repeats }}
          SNAPSHOTS: ${{ inputs.snapshots && '--snapshots' || '--no-snapshots' }}
        run: |
          model="$OPENCODE_MODEL"
          if [ "$ENGINE" = claude ]; then model="$CLAUDE_MODEL"; fi
          # --hide-answers: load the cases and the sample project into memory, then delete the answer key from this
          # checkout (all of evals/, every other file that gives an answer away, .git) before the first agent starts.
          # The result file is written to evals/triage/results/ after the last agent finished.
          python3 evals/triage/run-eval.py --hide-answers --engine "$ENGINE" ${model:+--model "$model"} \
            --repeats "$REPEATS" "$SNAPSHOTS" --jobs 4 --work-dir "$RUNNER_TEMP/triage-eval"

      - name: Upload the result file
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: triage-eval-results
          path: evals/triage/results/
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload the agents' logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: triage-eval-logs
          # Each run's own folder: its log (the engine's full transcript) and its result.
          path: |
            ${{ runner.temp }}/triage-eval/trials/*/agent.log
            ${{ runner.temp }}/triage-eval/trials/*/result.json
          if-no-files-found: ignore
          retention-days: 30
