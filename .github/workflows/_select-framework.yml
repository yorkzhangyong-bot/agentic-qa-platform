name: _select-framework

# Reusable helper: validates the agent engine and reads frameworks/<framework>.json from agentic-qa-platform,
# exposing every key as an output. Scalars come out as plain strings; arrays and objects (install, env,
# locator_priority, forbidden_paths) as compact JSON. Derived outputs:
#   install_script        install commands, one per line
#   forbidden_paths_csv   forbidden paths joined with commas (the input format of anti-cheat.sh)
#   runtime               "java" when the commands use Maven/Gradle, otherwise "node"
#   error_context_glob    the optional key's value, or "" when the config has none
#   engine                the validated engine (claude or opencode)

on:
  workflow_call:
    inputs:
      framework:
        description: Framework config to read, i.e. frameworks/<framework>.json (playwright, cypress, selenium).
        type: string
        required: true
      engine:
        description: Agent engine, claude or opencode. Anything else fails here, before any test runs.
        type: string
        default: claude
      platform_ref:
        description: Optional branch, tag or SHA of agentic-qa-platform to read the config from. Empty uses the commit of this workflow (job.workflow_sha).
        type: string
        default: ""
    secrets:
      PLATFORM_TOKEN:
        description: Optional token with read access to agentic-qa-platform (only needed if it is private).
        required: false
    outputs:
      name:
        description: Framework name.
        value: ${{ jobs.select.outputs.name }}
      install:
        description: Install commands (JSON array).
        value: ${{ jobs.select.outputs.install }}
      install_script:
        description: Install commands, one per line.
        value: ${{ jobs.select.outputs.install_script }}
      run:
        description: Test command.
        value: ${{ jobs.select.outputs.run }}
      env:
        description: Environment variables for the test command (JSON object).
        value: ${{ jobs.select.outputs.env }}
      report_glob:
        description: Glob of the JUnit XML reports.
        value: ${{ jobs.select.outputs.report_glob }}
      error_context_glob:
        description: Glob of the files the framework saves for each failed test (Playwright's error-context.md), or empty.
        value: ${{ jobs.select.outputs.error_context_glob }}
      test_glob:
        description: Glob of the test files.
        value: ${{ jobs.select.outputs.test_glob }}
      default_test_dir:
        description: Default directory for tests.
        value: ${{ jobs.select.outputs.default_test_dir }}
      locator_priority:
        description: Preferred locator strategies, best first (JSON array).
        value: ${{ jobs.select.outputs.locator_priority }}
      forbidden_paths:
        description: Paths agents must never change (JSON array).
        value: ${{ jobs.select.outputs.forbidden_paths }}
      forbidden_paths_csv:
        description: Forbidden paths, comma-separated.
        value: ${{ jobs.select.outputs.forbidden_paths_csv }}
      agents_dir:
        description: Directory with the framework's planner/generator/healer agents.
        value: ${{ jobs.select.outputs.agents_dir }}
      mcp:
        description: MCP server the agents use.
        value: ${{ jobs.select.outputs.mcp }}
      runtime:
        description: Runtime to set up besides Node.js (java or node).
        value: ${{ jobs.select.outputs.runtime }}
      engine:
        description: The validated agent engine (claude or opencode).
        value: ${{ jobs.select.outputs.engine }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  select:
    name: Read frameworks/${{ inputs.framework }}.json
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.read.outputs.name }}
      install: ${{ steps.read.outputs.install }}
      install_script: ${{ steps.read.outputs.install_script }}
      run: ${{ steps.read.outputs.run }}
      env: ${{ steps.read.outputs.env }}
      report_glob: ${{ steps.read.outputs.report_glob }}
      error_context_glob: ${{ steps.read.outputs.error_context_glob }}
      test_glob: ${{ steps.read.outputs.test_glob }}
      default_test_dir: ${{ steps.read.outputs.default_test_dir }}
      locator_priority: ${{ steps.read.outputs.locator_priority }}
      forbidden_paths: ${{ steps.read.outputs.forbidden_paths }}
      forbidden_paths_csv: ${{ steps.read.outputs.forbidden_paths_csv }}
      agents_dir: ${{ steps.read.outputs.agents_dir }}
      mcp: ${{ steps.read.outputs.mcp }}
      runtime: ${{ steps.read.outputs.runtime }}
      engine: ${{ steps.engine.outputs.engine }}
    steps:
      - name: Validate engine
        id: engine
        env:
          ENGINE: ${{ inputs.engine }}
        run: |
          case "$ENGINE" in
            claude|opencode) echo "engine=$ENGINE" >> "$GITHUB_OUTPUT"; echo "Agent engine: $ENGINE" ;;
            *) echo "::error::Unknown engine '$ENGINE'. Use claude or opencode."; exit 1 ;;
          esac

      - name: Checkout framework configs
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ inputs.platform_ref || job.workflow_sha }}
          token: ${{ secrets.PLATFORM_TOKEN || github.token }}
          path: .agentic-qa
          # Only frameworks/. Not cone mode, which adds every top-level file, README.md and BACKLOG.md included.
          sparse-checkout: |
            /frameworks/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Read config
        id: read
        env:
          FRAMEWORK: ${{ inputs.framework }}
        run: |
          if [[ ! "$FRAMEWORK" =~ ^[a-z0-9][a-z0-9_-]*$ ]]; then
            echo "::error::Invalid framework name '$FRAMEWORK'."
            exit 1
          fi
          cfg=".agentic-qa/frameworks/${FRAMEWORK}.json"
          if [ ! -f "$cfg" ]; then
            available="$(find .agentic-qa/frameworks -name '*.json' -exec basename {} .json \; | sort | paste -sd ' ' -)"
            echo "::error::Unknown framework '$FRAMEWORK'. Available: ${available}"
            exit 1
          fi
          jq empty "$cfg"

          keys="name install run report_glob test_glob default_test_dir locator_priority forbidden_paths agents_dir mcp"
          for key in $keys; do
            jq -e --arg k "$key" 'has($k)' "$cfg" > /dev/null || { echo "::error::$cfg is missing the key '$key'."; exit 1; }
          done

          emit() {  # multi-line safe output: name<<DELIMITER / value / DELIMITER
            local delimiter
            delimiter="EOF_$(openssl rand -hex 8)"
            printf '%s<<%s\n%s\n%s\n' "$1" "$delimiter" "$2" "$delimiter" >> "$GITHUB_OUTPUT"
          }
          for key in $keys env; do
            emit "$key" "$(jq -r --arg k "$key" '(.[$k] // {}) | if type == "string" then . else tojson end' "$cfg")"
          done
          emit install_script "$(jq -r '.install | if type == "array" then join("\n") else . end' "$cfg")"
          emit forbidden_paths_csv "$(jq -r '.forbidden_paths | join(",")' "$cfg")"
          emit error_context_glob "$(jq -r '.error_context_glob // ""' "$cfg")"
          if jq -e '[(.install | if type == "array" then .[] else . end), .run] | any(test("\\b(mvnw?|gradlew?)\\b"))' "$cfg" > /dev/null; then
            emit runtime java
          else
            emit runtime node
          fi

          {
            echo "### Framework config: \`$cfg\`"
            echo '```json'
            jq . "$cfg"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
