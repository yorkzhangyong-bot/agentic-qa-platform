name: generate-tests

# Reusable workflow: turn a spec (markdown file, Spec Kit folder, GitHub issue or Jira ticket) into tests. The planner
# agent writes results/plan.md, the generator agent implements it against the live app, the tests run, anti-cheat.sh
# checks the diff, and the pr-writer agent describes the result in a pull request on auto-generate/<run_id>.
# Agents run on the selected engine (Claude Code or OpenCode) via scripts/stage-agents.sh and scripts/run-agent.sh.

on:
  workflow_call:
    inputs:
      framework:
        description: Framework config to use (playwright, cypress, selenium, i.e. frameworks/<framework>.json).
        type: string
        required: true
      test_dir:
        description: Directory for the generated tests, relative to the repository root. Empty means the framework's default_test_dir.
        type: string
        default: ""
      app_url:
        description: Base URL of a running, disposable test instance of the app (never production), explored by the agents through the browser MCP server.
        type: string
        default: ""
      engine:
        description: Agent engine, claude or opencode.
        type: string
        default: claude
      spec_path:
        description: Markdown spec file or Spec Kit feature folder (e.g. specs/003-feature) in the repository. Highest priority.
        type: string
        default: ""
      issue_number:
        description: GitHub issue whose title and body are the spec.
        type: string
        default: ""
      jira_key:
        description: Jira issue key, e.g. QA-123.
        type: string
        default: ""
      jira_base_url:
        description: Jira site, e.g. https://your-company.atlassian.net (required with jira_key).
        type: string
        default: ""
      jira_email:
        description: Jira Cloud account email for basic auth with JIRA_TOKEN. Leave empty to send JIRA_TOKEN as a Bearer token.
        type: string
        default: ""
      node_version:
        description: Node.js version (always installed, because the agent engines and the browser MCP server need it).
        type: string
        default: "20"
      java_version:
        description: Java version (installed when the framework runs Maven or Gradle).
        type: string
        default: "17"
      plan_max_turns:
        description: Turn budget for the planner agent (claude --max-turns; emulated with a time limit on opencode).
        type: number
        default: 20
      generate_max_turns:
        description: Turn budget for the generator agent (claude --max-turns; emulated with a time limit on opencode).
        type: number
        default: 80
      claude_code_version:
        description: Version of @anthropic-ai/claude-code to install when engine is claude.
        type: string
        default: "2.1.283"
      opencode_version:
        description: Version of opencode-ai to install when engine is opencode.
        type: string
        default: "1.19.5"
      opencode_model:
        description: Model for the OpenCode agents, as provider/model.
        type: string
        default: deepseek/deepseek-flash
      playwright_mcp_version:
        description: Version of @playwright/mcp to run as the browser MCP server.
        type: string
        default: "0.0.84"
      platform_ref:
        description: Optional branch, tag or SHA of agentic-qa-platform to take scripts, agents and configs from. Empty uses the commit of this workflow (job.workflow_sha).
        type: string
        default: ""
    secrets:
      ANTHROPIC_API_KEY:
        description: Dedicated, low-quota Anthropic API key. Required when engine is claude.
        required: false
      DEEPSEEK_API_KEY:
        description: DeepSeek API key for OpenCode. With engine opencode, set at least one provider key.
        required: false
      OPENROUTER_API_KEY:
        description: OpenRouter API key for OpenCode. With engine opencode, set at least one provider key.
        required: false
      OPENAI_API_KEY:
        description: OpenAI API key for OpenCode. With engine opencode, set at least one provider key.
        required: false
      JIRA_TOKEN:
        description: Jira API token (required with jira_key).
        required: false
      PLATFORM_TOKEN:
        description: Optional token with read access to agentic-qa-platform (only needed if it is private).
        required: false
      APP_ENV:
        description: Optional. The app's own variables for the test runs, one KEY=value per line (e.g. its API keys). Loaded only into the test run after generation, never into agent steps. Use repository secrets; secrets of a GitHub Environment aren't visible to reusable workflows.
        required: false
    outputs:
      pr_url:
        description: URL of the auto-generate pull request, if one was opened.
        value: ${{ jobs.generate.outputs.pr_url }}

permissions:
  contents: read

# One run per caller workflow and ref at a time. Later runs wait; a generation in progress is never cancelled.
concurrency:
  group: agentic-qa-generate-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  config:
    name: Framework config
    uses: ./.github/workflows/_select-framework.yml
    with:
      framework: ${{ inputs.framework }}
      engine: ${{ inputs.engine }}
      platform_ref: ${{ inputs.platform_ref }}
    secrets:
      PLATFORM_TOKEN: ${{ secrets.PLATFORM_TOKEN }}

  generate:
    name: Generate ${{ inputs.framework }} tests
    needs: config
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: read
    outputs:
      pr_url: ${{ steps.pr.outputs.pull-request-url }}
    env:
      ENGINE: ${{ inputs.engine }}
      FRAMEWORK: ${{ inputs.framework }}
      TEST_DIR: ${{ inputs.test_dir || needs.config.outputs.default_test_dir }}
      APP_URL: ${{ inputs.app_url }}
      PLATFORM_DIR: .agentic-qa
      MCP_SERVER: ${{ needs.config.outputs.mcp }}
      PLAYWRIGHT_MCP_VERSION: ${{ inputs.playwright_mcp_version }}
      OPENCODE_MODEL: ${{ inputs.opencode_model }}
      MCP_TIMEOUT: "60000"
    steps:
      - name: Check engine credentials
        env:
          HAS_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_DEEPSEEK: ${{ secrets.DEEPSEEK_API_KEY != '' }}
          HAS_OPENROUTER: ${{ secrets.OPENROUTER_API_KEY != '' }}
          HAS_OPENAI: ${{ secrets.OPENAI_API_KEY != '' }}
        run: |
          case "$ENGINE" in
            claude)
              [ "$HAS_ANTHROPIC" = true ] || { echo "::error::engine claude needs the ANTHROPIC_API_KEY secret."; exit 1; }
              ;;
            opencode)
              if [ "$HAS_DEEPSEEK" != true ] && [ "$HAS_OPENROUTER" != true ] && [ "$HAS_OPENAI" != true ]; then
                echo "::error::engine opencode needs at least one of the DEEPSEEK_API_KEY, OPENROUTER_API_KEY or OPENAI_API_KEY secrets."
                exit 1
              fi
              provider="${OPENCODE_MODEL%%/*}"
              case "$provider" in
                deepseek) has="$HAS_DEEPSEEK"; key=DEEPSEEK_API_KEY ;;
                openrouter) has="$HAS_OPENROUTER"; key=OPENROUTER_API_KEY ;;
                openai) has="$HAS_OPENAI"; key=OPENAI_API_KEY ;;
                *) has=unknown; key="" ;;
              esac
              if [ "$has" = false ]; then echo "::warning::opencode_model '$OPENCODE_MODEL' uses provider '$provider', but $key is not set."; fi
              ;;
            *)
              echo "::error::Unknown engine '$ENGINE'. Use claude or opencode."
              exit 1
              ;;
          esac
          echo "Agent engine: $ENGINE"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout agentic-qa-platform
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ inputs.platform_ref || job.workflow_sha }}
          token: ${{ secrets.PLATFORM_TOKEN || github.token }}
          path: .agentic-qa
          # Only what the jobs use at run time, never evals/, tests/, BACKLOG.md, README.md or .github/
          # (tests/platform-checkout/check.py checks both). Not cone mode, which adds every top-level file.
          sparse-checkout: |
            /AGENT-RULES.md
            /agents/
            /frameworks/
            /scripts/
            /settings/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # Before any agent runs: the agents must never see the platform's evals/ (the triage eval's answer key),
      # tests/ or BACKLOG.md, so fail if the checkout above has any of them.
      - name: Check the platform checkout
        run: bash "$PLATFORM_DIR/scripts/check-platform-checkout.sh"

      # Fails fast on a malformed APP_ENV and masks its values in this job's logs, before any agent runs. Only the
      # test run after generation gets the values.
      - name: Check APP_ENV
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
        run: bash "$PLATFORM_DIR/scripts/load-app-env.sh" --check

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          cache: ${{ needs.config.outputs.runtime == 'node' && 'npm' || '' }}

      - name: Set up Java
        if: needs.config.outputs.runtime == 'java'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          cache: ${{ hashFiles('pom.xml') != '' && 'maven' || '' }}

      - name: Install dependencies
        env:
          INSTALL_SCRIPT: ${{ needs.config.outputs.install_script }}
        run: |
          while IFS= read -r cmd; do
            [ -n "$cmd" ] || continue
            echo "::group::$cmd"
            bash -c "$cmd" < /dev/null
            echo "::endgroup::"
          done <<< "$INSTALL_SCRIPT"

      - name: Fetch spec
        id: spec
        env:
          SPEC_PATH: ${{ inputs.spec_path }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          JIRA_KEY: ${{ inputs.jira_key }}
          JIRA_BASE_URL: ${{ inputs.jira_base_url }}
          JIRA_EMAIL: ${{ inputs.jira_email }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          bash "$PLATFORM_DIR/scripts/fetch-spec.sh"
          title="$(head -n 1 spec.md | sed -e 's/^#*[[:space:]]*//' | cut -c1-80)"
          echo "title=${title:-specification}" >> "$GITHUB_OUTPUT"

      - name: Install agent engine
        env:
          CLAUDE_CODE_VERSION: ${{ inputs.claude_code_version }}
          OPENCODE_VERSION: ${{ inputs.opencode_version }}
        run: |
          if [ "$ENGINE" = opencode ]; then
            npm install -g "opencode-ai@${OPENCODE_VERSION}"
            opencode --version
          else
            npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
            claude --version
          fi

      - name: Stage agents and engine config
        run: bash "$PLATFORM_DIR/scripts/stage-agents.sh"

      - name: Record base commits
        run: |
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "PLATFORM_SHA=$(git -C "$PLATFORM_DIR" rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Plan (planner agent)
        env:
          ANTHROPIC_API_KEY: ${{ inputs.engine == 'claude' && secrets.ANTHROPIC_API_KEY || '' }}
          DEEPSEEK_API_KEY: ${{ inputs.engine == 'opencode' && secrets.DEEPSEEK_API_KEY || '' }}
          OPENROUTER_API_KEY: ${{ inputs.engine == 'opencode' && secrets.OPENROUTER_API_KEY || '' }}
          OPENAI_API_KEY: ${{ inputs.engine == 'opencode' && secrets.OPENAI_API_KEY || '' }}
          AGENT: planner
          MAX_TURNS: ${{ inputs.plan_max_turns }}
          EXPECTED_OUTPUT: results/plan.md
          PROMPT: >-
            Read spec.md and write results/plan.md as described in your instructions. Test dir: ${{ env.TEST_DIR }}.
            Framework config: .agentic-qa/frameworks/${{ inputs.framework }}.json. App URL: ${{ inputs.app_url || 'not provided' }}.
        run: bash "$PLATFORM_DIR/scripts/run-agent.sh"

      - name: Generate tests (generator agent)
        env:
          ANTHROPIC_API_KEY: ${{ inputs.engine == 'claude' && secrets.ANTHROPIC_API_KEY || '' }}
          DEEPSEEK_API_KEY: ${{ inputs.engine == 'opencode' && secrets.DEEPSEEK_API_KEY || '' }}
          OPENROUTER_API_KEY: ${{ inputs.engine == 'opencode' && secrets.OPENROUTER_API_KEY || '' }}
          OPENAI_API_KEY: ${{ inputs.engine == 'opencode' && secrets.OPENAI_API_KEY || '' }}
          AGENT: generator
          MAX_TURNS: ${{ inputs.generate_max_turns }}
          PROMPT: >-
            Implement the scenarios in results/plan.md as tests in ${{ env.TEST_DIR }} and write results/generate-report.json
            as described in your instructions. Framework config: .agentic-qa/frameworks/${{ inputs.framework }}.json.
            App URL: ${{ inputs.app_url || 'not provided' }}.
        run: |
          # No EXPECTED_OUTPUT: a missing report is only a warning, the diff is the real evidence.
          bash "$PLATFORM_DIR/scripts/run-agent.sh" || echo "::warning::The generator stopped early (exit code $?); checking what it produced."
          if [ ! -s results/generate-report.json ]; then
            echo "::warning::The generator agent did not write results/generate-report.json; the PR description will rely on the diff."
          fi

      - name: Run tests
        id: run
        continue-on-error: true
        env:
          # The agents in this job never get APP_ENV: load-app-env.sh puts the values into the test command only.
          APP_ENV: ${{ secrets.APP_ENV }}
          RUN_CMD: ${{ needs.config.outputs.run }}
          FRAMEWORK_ENV: ${{ needs.config.outputs.env }}
          REPORT_GLOB: ${{ needs.config.outputs.report_glob }}
        run: |
          shopt -s globstar nullglob
          for f in $REPORT_GLOB; do rm -f -- "$f"; done   # drop reports left over from the generator's own runs
          mkdir -p results
          env_json="${FRAMEWORK_ENV:-}"
          [ -n "$env_json" ] || env_json='{}'
          eval "$(jq -r 'to_entries[] | "export \(.key)=\(.value | tostring | @sh)"' <<< "$env_json")"
          if [ -n "$APP_URL" ]; then export BASE_URL="$APP_URL" CYPRESS_BASE_URL="$APP_URL"; fi
          echo "+ $RUN_CMD"
          bash "$PLATFORM_DIR/scripts/load-app-env.sh" -- bash -c "$RUN_CMD"

      - name: Test results summary
        if: always()
        continue-on-error: true   # the summary must never fail the job; write-summary.sh itself always exits 0
        env:
          REPORT_GLOB: ${{ needs.config.outputs.report_glob }}
        run: bash "$PLATFORM_DIR/scripts/write-summary.sh" "$REPORT_GLOB"

      - name: Parse JUnit report
        env:
          REPORT_GLOB: ${{ needs.config.outputs.report_glob }}
        run: bash "$PLATFORM_DIR/scripts/parse-report.sh" "$REPORT_GLOB"

      - name: Anti-cheat
        env:
          FORBIDDEN_PATHS: ${{ needs.config.outputs.forbidden_paths_csv }}
        run: |
          set -o pipefail
          if [ "$(git -C "$PLATFORM_DIR" rev-parse HEAD)" != "$PLATFORM_SHA" ] || [ -n "$(git -C "$PLATFORM_DIR" status --porcelain)" ]; then
            echo "::error::Files in .agentic-qa/ were modified during the agent run, so anti-cheat.sh cannot be trusted."
            exit 1
          fi
          bash "$PLATFORM_DIR/scripts/anti-cheat.sh" "$FORBIDDEN_PATHS" "$BASE_SHA" | tee results/anti-cheat.txt

      - name: Detect test changes
        id: changes
        run: |
          changes="$(git status --porcelain --untracked-files=all -- . ':(exclude).mcp.json' ':(exclude).claude' \
            ':(exclude).opencode' ':(exclude)AGENTS.md' ':(exclude)opencode.json')"
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::The generator did not create or change any test files; see the 'Generate tests' step."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Write PR description (pr-writer agent)
        if: steps.changes.outputs.changed == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ inputs.engine == 'claude' && secrets.ANTHROPIC_API_KEY || '' }}
          DEEPSEEK_API_KEY: ${{ inputs.engine == 'opencode' && secrets.DEEPSEEK_API_KEY || '' }}
          OPENROUTER_API_KEY: ${{ inputs.engine == 'opencode' && secrets.OPENROUTER_API_KEY || '' }}
          OPENAI_API_KEY: ${{ inputs.engine == 'opencode' && secrets.OPENAI_API_KEY || '' }}
          AGENT: pr-writer
          MAX_TURNS: "20"
          EXPECTED_OUTPUT: PR_BODY.md
          PROMPT: >-
            Write PR_BODY.md for this auto-generate run as described in your instructions. Framework: ${{ inputs.framework }}.
            Test dir: ${{ env.TEST_DIR }}. Test run after generation: ${{ steps.run.outcome }}. Read spec.md, results/plan.md,
            results/generate-report.json, results/failures.json, results/anti-cheat.txt and the git diff.
        run: |
          fingerprint() { { git diff HEAD --binary; git ls-files --others --exclude-standard -z | xargs -0 -r sha256sum; } | sha256sum; }
          before="$(fingerprint)"
          bash "$PLATFORM_DIR/scripts/run-agent.sh"
          if [ "$(fingerprint)" != "$before" ]; then
            echo "::error::The pr-writer agent changed files after anti-cheat ran. Refusing to open the pull request."
            exit 1
          fi

      - name: Restore platform-staged files
        if: steps.changes.outputs.changed == 'true'
        run: |
          # Staging may have overwritten files the repository tracks; they must not end up in the pull request.
          # `.opencode` covers the staged .opencode/agents/.
          for p in .mcp.json .claude/settings.json .claude/agents .opencode AGENTS.md opencode.json; do
            if git ls-files --error-unmatch -- "$p" > /dev/null 2>&1; then git checkout -- "$p"; fi
          done
          git status --short

      - name: Open pull request
        id: pr
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: auto-generate/${{ github.run_id }}
          base: ${{ github.head_ref || github.ref_name }}
          title: "Auto-generate: tests for ${{ steps.spec.outputs.title }}"
          body-path: PR_BODY.md
          labels: auto-generate
          commit-message: "test: add generated ${{ inputs.framework }} tests (run ${{ github.run_id }})"
          draft: ${{ steps.run.outcome == 'failure' }}
          delete-branch: true

      - name: Job summary
        if: always()
        env:
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
          TEST_OUTCOME: ${{ steps.run.outcome }}
        run: |
          {
            echo "## Auto-generate (${FRAMEWORK}, engine ${ENGINE})"
            echo
            if [ -f spec.md ]; then echo "Spec: $(head -n 1 spec.md)"; fi
            if [ -f results/plan.md ]; then echo; echo "Scenarios planned: $(grep -cE '^### [0-9]+\.' results/plan.md || true)"; fi
            echo
            echo "Test run after generation: ${TEST_OUTCOME:-not run}"
            if [ -f results/failures.json ]; then echo; echo "Failing tests: $(jq length results/failures.json)"; fi
            if [ -n "$PR_URL" ]; then echo; echo "Pull request: $PR_URL"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload agent results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: auto-generate-results
          path: |
            results/
            spec.md
            PR_BODY.md
          if-no-files-found: ignore
          retention-days: 14
