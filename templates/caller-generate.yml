# Copy to .github/workflows/generate-tests.yml in your repository.
name: Generate tests
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      spec_path: { description: "Spec markdown file or Spec Kit folder (e.g. specs/003-feature)", required: false }
jobs:
  generate:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'ready-for-tests'
    uses: yorkzhangyong-bot/agentic-qa-platform/.github/workflows/generate-tests.yml@main
    permissions: { contents: write, pull-requests: write, issues: read }
    with:
      framework: playwright # playwright | cypress | selenium
      app_url: ${{ vars.APP_URL }}
      issue_number: ${{ github.event.issue.number }}
      spec_path: ${{ inputs.spec_path }}
      # engine: opencode    # default claude; opencode needs one of the provider keys below
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      # The app's own secrets for the test run after generation, one KEY=value per line; never given to the agents.
      # Use repository secrets: secrets stored under a GitHub Environment aren't visible to reusable workflows.
      # APP_ENV: |
      #   OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
